baseURL = "https://newfoundlandsaga.com/"
title = "Newfoundland Saga"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  env = "production"
  title = "Newfoundland Saga"
  description = "An honest guide to living in Newfoundland, written by someone who came from away too."
  author = "Newfoundland Saga"
  defaultTheme = "auto"

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

[params.homeInfoParams]
  Title = "So you're moving to Newfoundland."
  Content = "Nobody warned you. We will. An honest guide to living on The Rock — for international students, newcomers, and CFAs."

[[params.socialIcons]]
  name = "email"
  url = "mailto:jaehong.jin@gmail.com"

